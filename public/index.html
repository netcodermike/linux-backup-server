<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backup Vault</title>
<style>body{font:17px system-ui;background:#101d2b;color:#e5eff9;max-width:900px;margin:60px auto;padding:20px}input,button,select{font:inherit;padding:12px;margin:8px 0;background:#203449;color:white;border:1px solid #6484a1;border-radius:6px}input{width:90%}button{background:#25645e;cursor:pointer}label{display:block}li{padding:12px}h1{font-size:48px}code{overflow-wrap:anywhere}</style>
<h1>Your backup vault.</h1><p>List snapshots and decrypt individual files in this browser. Keys and tokens stay in this page's memory. Use localhost or HTTPS.</p>
<label>Vault token <input id="token" type="password" autocomplete="off"></label><label>Encryption key (64 hex characters) <input id="key" type="password" autocomplete="off"></label>
<button id="list">Load snapshots</button><label>Snapshot <select id="snapshots" aria-label="Snapshot"></select></label><button id="open">Decrypt manifest</button><p id="status" role="status"></p><ul id="files"></ul>
<script>
const el=id=>document.getElementById(id);let manifest;
async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+el('token').value}});if(!r.ok)throw Error('Server returned '+r.status);return r;}
async function decrypt(data){const hex=el('key').value.trim();if(!/^[a-fA-F0-9]{64}$/.test(hex))throw Error('Key must be 64 hex characters');const key=await crypto.subtle.importKey('raw',Uint8Array.from(hex.match(/../g),x=>parseInt(x,16)),'AES-GCM',false,['decrypt']);const b=new Uint8Array(data);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));}
function failure(e){el('status').textContent=e.message||'Decryption failed: check your key and connection.';}
el('list').onclick=async()=>{try{const ids=await(await get('/manifests')).json();el('snapshots').replaceChildren(...ids.map(id=>new Option(id,id)));el('status').textContent=ids.length+' snapshots available.';}catch(e){failure(e);}};
el('open').onclick=async()=>{try{const id=el('snapshots').value;if(!id)throw Error('Choose a snapshot first');const data=await(await get('/manifests/'+id)).arrayBuffer();manifest=JSON.parse(new TextDecoder().decode(await decrypt(data)));el('files').replaceChildren();for(const [name,hash]of Object.entries(manifest.files)){if(!/^[a-f0-9]{64}$/.test(hash))throw Error('Invalid object ID');const li=document.createElement('li');const button=document.createElement('button');button.textContent='Download '+name;button.onclick=async()=>{try{const plain=await decrypt(await(await get('/objects/'+hash)).arrayBuffer());const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',plain)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!==hash)throw Error('Object hash mismatch');const url=URL.createObjectURL(new Blob([plain]));const a=document.createElement('a');a.href=url;a.download=name.split(/[\\/]/).pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){failure(e);}};li.append(button);el('files').append(li);}el('status').textContent='Manifest decrypted. Downloads restore individual files; use the CLI to preserve folders.';}catch(e){failure(e);}};
</script></html>
